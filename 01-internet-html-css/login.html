<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f7;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.55;
      will-change: transform;
    }

    .orb1 {
      width: 520px;
      height: 520px;
      background: #a8c8ff;
      top: -120px;
      left: -100px;
      animation: drift1 14s ease-in-out infinite;
    }

    .orb2 {
      width: 420px;
      height: 420px;
      background: #b9f0d8;
      bottom: -80px;
      right: -80px;
      animation: drift2 17s ease-in-out infinite;
    }

    .orb3 {
      width: 300px;
      height: 300px;
      background: #d4b8ff;
      top: 50%;
      left: 55%;
      animation: drift3 20s ease-in-out infinite;
    }

    .orb4 {
      width: 220px;
      height: 220px;
      background: #ffd6a5;
      bottom: 20%;
      left: 10%;
      animation: drift4 11s ease-in-out infinite;
    }

    @keyframes drift1 {
      0%, 100% { transform: translate(0, 0); }
      33%       { transform: translate(60px, 80px); }
      66%       { transform: translate(-40px, 50px); }
    }

    @keyframes drift2 {
      0%, 100% { transform: translate(0, 0); }
      33%       { transform: translate(-70px, -60px); }
      66%       { transform: translate(30px, -90px); }
    }

    @keyframes drift3 {
      0%, 100% { transform: translate(-50%, -50%); }
      33%       { transform: translate(calc(-50% + 80px), calc(-50% - 40px)); }
      66%       { transform: translate(calc(-50% - 50px), calc(-50% + 60px)); }
    }

    @keyframes drift4 {
      0%, 100% { transform: translate(0, 0); }
      50%       { transform: translate(40px, -50px); }
    }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      padding: 44px 40px 40px;
      width: 360px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
      transition: transform 0.08s ease-out;
    }

    h1 {
      font-size: 26px;
      font-weight: 600;
      color: #1d1d1f;
      letter-spacing: -0.4px;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: #6e6e73;
      margin-bottom: 32px;
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #1d1d1f;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid rgba(0,0,0,0.12);
      border-radius: 10px;
      font-family: inherit;
      font-size: 15px;
      color: #1d1d1f;
      background: rgba(255,255,255,0.8);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      appearance: none;
    }

    input::placeholder {
      color: #aeaeb2;
      font-weight: 400;
    }

    input:focus {
      border-color: #0071e3;
      box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.18);
    }

    .forgot-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 5px;
      margin-bottom: 24px;
    }

    .forgot-row a {
      font-size: 13px;
      color: #0071e3;
      text-decoration: none;
    }

    .forgot-row a:hover {
      text-decoration: underline;
    }

    button[type="submit"] {
      width: 100%;
      padding: 12px;
      background: #0071e3;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: -0.1px;
      transition: background 0.15s, transform 0.1s;
    }

    button[type="submit"]:hover {
      background: #0077ed;
    }

    button[type="submit"]:active {
      background: #006edb;
      transform: scale(0.99);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0;
      color: #aeaeb2;
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(0,0,0,0.1);
    }

    .signup {
      text-align: center;
      font-size: 13px;
      color: #6e6e73;
    }

    .signup a {
      color: #0071e3;
      text-decoration: none;
    }

    .signup a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="bg">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
    <div class="orb orb4"></div>
  </div>

  <div class="card" id="card">
    <h1>Sign in</h1>
    <p class="subtitle">Enter your details to continue.</p>

    <form>
      <div class="field">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          autocomplete="email"
        />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          autocomplete="current-password"
        />
      </div>

      <div class="forgot-row">
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit">Log In</button>
    </form>

    <div class="divider">or</div>

    <p class="signup">Don't have an account? <a href="#">Create one</a></p>
  </div>

  <script>
    const card = document.getElementById('card');
    const orbs = document.querySelectorAll('.orb');

    document.addEventListener('mousemove', function(e) {
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;
      const dx = (e.clientX - cx) / cx;
      const dy = (e.clientY - cy) / cy;

      card.style.transform = 'rotateY(' + (dx * 5) + 'deg) rotateX(' + (-dy * 5) + 'deg)';

      orbs.forEach(function(orb, i) {
        var depth = (i + 1) * 12;
        var tx = dx * depth;
        var ty = dy * depth;
        if (i === 2) {
          orb.style.transform = 'translate(calc(-50% + ' + tx + 'px), calc(-50% + ' + ty + 'px))';
        } else {
          orb.style.transform = 'translate(' + tx + 'px, ' + ty + 'px)';
        }
      });
    });

    document.addEventListener('mouseleave', function() {
      card.style.transform = 'rotateY(0deg) rotateX(0deg)';
    });
  </script>

</body>
</html>
