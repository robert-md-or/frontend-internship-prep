<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flexbox Row</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f7;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: 40px 20px;
    }

    .cards-container {
      display: flex;
      flex-direction: row;
      gap: 16px;
      max-width: 960px;
      width: 100%;
    }

    @media (max-width: 600px) {
      .cards-container {
        flex-direction: column;
      }
    }

    .card {
      background: #fff;
      border-radius: 18px;
      overflow: hidden;
      flex: 1;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06), 0 12px 40px rgba(0,0,0,0.06);
    }

    .card-image {
      width: 100%;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card:nth-child(1) .card-image { background: #e8f0fe; }
    .card:nth-child(2) .card-image { background: #e6f4ea; }
    .card:nth-child(3) .card-image { background: #fce8e6; }

    .card-image svg {
      opacity: 0.5;
    }

    .card-body {
      padding: 20px;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 8px;
      display: block;
    }

    .card:nth-child(1) .badge { color: #0071e3; }
    .card:nth-child(2) .badge { color: #34a853; }
    .card:nth-child(3) .badge { color: #ea4335; }

    h2 {
      font-size: 16px;
      font-weight: 600;
      color: #1d1d1f;
      letter-spacing: -0.2px;
      margin-bottom: 6px;
    }

    .description {
      font-size: 13px;
      color: #6e6e73;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    .bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .price {
      font-size: 18px;
      font-weight: 600;
      color: #1d1d1f;
      letter-spacing: -0.3px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    button:hover { opacity: 0.85; }
    button:active { transform: scale(0.98); opacity: 1; }

    .card:nth-child(1) button { background: #0071e3; color: #fff; }
    .card:nth-child(2) button { background: #34a853; color: #fff; }
    .card:nth-child(3) button { background: #ea4335; color: #fff; }
  </style>
</head>
<body>

  <div class="cards-container">

    <div class="card">
      <div class="card-image">
        <svg width="60" height="60" viewBox="0 0 60 60" fill="none">
          <rect x="8" y="14" width="44" height="32" rx="4" fill="#0071e3" opacity="0.2"/>
          <rect x="11" y="17" width="38" height="26" rx="2" fill="#0071e3" opacity="0.4"/>
          <circle cx="30" cy="30" r="6" fill="#0071e3"/>
        </svg>
      </div>
      <div class="card-body">
        <span class="badge">New</span>
        <h2>Wireless Headphones</h2>
        <p class="description">Premium sound quality with active noise cancellation.</p>
        <div class="bottom-row">
          <span class="price">$79.99</span>
          <button>Buy</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-image">
        <svg width="60" height="60" viewBox="0 0 60 60" fill="none">
          <rect x="18" y="8" width="24" height="40" rx="4" fill="#34a853" opacity="0.2"/>
          <rect x="21" y="11" width="18" height="34" rx="2" fill="#34a853" opacity="0.4"/>
          <circle cx="30" cy="38" r="3" fill="#34a853"/>
        </svg>
      </div>
      <div class="card-body">
        <span class="badge">Sale</span>
        <h2>Smartphone Stand</h2>
        <p class="description">Adjustable aluminum stand for any desk setup.</p>
        <div class="bottom-row">
          <span class="price">$24.99</span>
          <button>Buy</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-image">
        <svg width="60" height="60" viewBox="0 0 60 60" fill="none">
          <rect x="10" y="20" width="40" height="26" rx="4" fill="#ea4335" opacity="0.2"/>
          <rect x="24" y="14" width="12" height="8" rx="2" fill="#ea4335" opacity="0.3"/>
          <rect x="13" y="23" width="34" height="20" rx="2" fill="#ea4335" opacity="0.4"/>
          <circle cx="30" cy="33" r="4" fill="#ea4335"/>
        </svg>
      </div>
      <div class="card-body">
        <span class="badge">Popular</span>
        <h2>Mechanical Keyboard</h2>
        <p class="description">Compact TKL layout with satisfying tactile switches.</p>
        <div class="bottom-row">
          <span class="price">$119.99</span>
          <button>Buy</button>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
